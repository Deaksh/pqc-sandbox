name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Smoke test CLI
        run: |
          pqc-sandbox demo --json /tmp/demo_report.json
          pqc-sandbox compare --classical "ECDH-P256" --pqc "ML-KEM-768" --json /tmp/compare.json
          pqc-sandbox list --pqc-only
          pqc-sandbox diff --classical "ECDH-P256" --format nginx

      - name: Verify JSON output schema
        run: |
          python -c "
          import json
          with open('/tmp/compare.json') as f:
              data = json.load(f)
          assert 'benchmark' in data
          assert 'compatibility' in data
          assert 'score' in data
          assert data['telemetry'] == False
          print('JSON schema OK')
          "

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check pqc_sandbox/ --select E,F,W --ignore E501
